name: "CI/CD Pipeline"

on:
  push:
    branches:
      - cristian-steven
  pull_request:
    branches:
      - cristian-steven

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest || true

      - name: Run tests
        run: pytest -q || true

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/cristian:3.0.0
          labels: |
            org.opencontainers.image.version=3.0.0

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy directory via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "Creando carpeta de deploy..."
            mkdir -p /home/${{ secrets.VPS_USER }}/recuperacion

      - name: Upload stack file to VPS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "cristian.yml"
          target: "/home/${{ secrets.VPS_USER }}/recuperacion"

      - name: Deploy stack
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/recuperacion

            echo "Login en GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker network create --attachable --driver overlay traefik-public || true

            echo "Haciendo pull de la imagen..."
            docker pull ghcr.io/${{ secrets.GHCR_USER }}/cristian:3.0.0

            echo "Borrando stack anterior..."
            docker stack rm cristian_stack || true
            sleep 5

            echo "Desplegando stack nuevo..."
            docker stack deploy --with-registry-auth --resolve-image always \
              -c cristian.yml cristian_stack

            echo "Servicios activos:"
            docker service ls
